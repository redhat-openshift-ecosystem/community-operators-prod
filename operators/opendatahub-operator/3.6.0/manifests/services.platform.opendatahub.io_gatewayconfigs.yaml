apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  creationTimestamp: null
  name: gatewayconfigs.services.platform.opendatahub.io
spec:
  group: services.platform.opendatahub.io
  names:
    kind: GatewayConfig
    listKind: GatewayConfigList
    plural: gatewayconfigs
    singular: gatewayconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Ready
      jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - description: Reason
      jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GatewayConfig is the Schema for the gatewayconfigs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GatewayConfigSpec defines the desired state of GatewayConfig
            properties:
              additionalIngresses:
                description: |-
                  AdditionalIngresses defines additional Gateways managed by GatewayConfig.
                  Component controllers manage the HTTPRoutes attached to these Gateways.
                items:
                  description: AdditionalIngress defines an additional Gateway.
                  properties:
                    auth:
                      default: {}
                      description: |-
                        Auth configures this ingress's client credentials and auth proxy capacity.
                        Authentication mode and provider settings are inherited from the default gateway.
                      properties:
                        maxReplicas:
                          default: 10
                          description: |-
                            MaxReplicas is the maximum number of replicas for this ingress's auth proxy.
                            The minimum remains fixed at 2. This does not configure the default proxy.
                            A value of 2 fixes the HPA minimum and maximum at two replicas.
                          format: int32
                          maximum: 10
                          minimum: 2
                          type: integer
                        oidc:
                          description: |-
                            OIDC supplies this ingress's distinct client identity in OIDC mode.
                            Required in OIDC mode; omit in integrated OpenShift OAuth mode, where the
                            operator generates a distinct OAuthClient. The issuer comes from spec.oidc.
                          properties:
                            clientID:
                              description: ClientID is distinct from the default ingress
                                and sibling ingress client IDs.
                              minLength: 1
                              type: string
                            clientSecretRef:
                              description: |-
                                ClientSecretRef references an administrator-managed Secret containing the client secret.
                                Each ingress must reference a distinct Secret, including from the default ingress.
                                The operator must not own or delete this source Secret.
                                Name and key must be nonempty; optional must be omitted or false.
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
                                    must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                              x-kubernetes-validations:
                              - message: clientSecretRef.name must be non-empty
                                rule: has(self.name) && size(self.name) > 0
                              - message: clientSecretRef.key must be non-empty
                                rule: size(self.key) > 0
                              - message: clientSecretRef.optional must be false
                                rule: '!has(self.optional) || !self.optional'
                            secretNamespace:
                              description: SecretNamespace is the source Secret's
                                namespace; defaults to the gateway namespace.
                              type: string
                          required:
                          - clientID
                          - clientSecretRef
                          type: object
                      type: object
                    hostname:
                      description: Hostname is the externally visible hostname for
                        this ingress.
                      maxLength: 253
                      type: string
                    ingressControllerName:
                      description: IngressControllerName is the IngressController
                        whose Route admission is used for readiness.
                      maxLength: 63
                      pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    name:
                      description: |-
                        Name is the Gateway name and stable identity of this ingress.
                        The 36-character limit keeps Istio's <Gateway>-<GatewayClass> Service name within 63 characters.
                      maxLength: 36
                      pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
                      type: string
                      x-kubernetes-validations:
                      - message: name conflicts with a default Gateway
                        rule: self != 'data-science-gateway' && self != 'rh-ai-gateway'
                    routeLabels:
                      additionalProperties:
                        type: string
                      description: |-
                        RouteLabels are applied to the bridge Route and can match the target
                        IngressController route selector. They do not prevent other matching
                        IngressControllers from admitting the Route.
                      minProperties: 1
                      type: object
                  required:
                  - hostname
                  - ingressControllerName
                  - name
                  - routeLabels
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              authProxyMaxReplicas:
                default: 10
                description: |-
                  AuthProxyMaxReplicas is the maximum number of replicas for the default gateway's auth proxy.
                  The HPA minimum is fixed at 2; setting the maximum to 2 fixes the replica count.
                  Additional ingress proxies are configured independently through their auth.maxReplicas.
                format: int32
                maximum: 10
                minimum: 2
                type: integer
              authProxyTimeout:
                description: |-
                  AuthProxyTimeout defines the timeout for external authorization service calls (e.g., "5s", "10s")
                  This controls how long Envoy waits for a response from the authentication proxy before timing out 403 response.
                type: string
              authTimeout:
                description: |-
                  AuthTimeout is the duration Envoy waits for auth proxy responses.
                  Requests timeout with 403 if exceeded.
                  Deprecated: Use AuthProxyTimeout instead.
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                type: string
              certificate:
                description: Certificate specifies configuration of the TLS certificate
                  securing communication for the gateway.
                properties:
                  issuerRef:
                    description: |-
                      IssuerRef optionally overrides the cert-manager issuer used on XKS. The gateway TLS certificate
                      uses it when Type=SelfSigned; the kube-auth-proxy TLS certificate uses it whenever the auth proxy
                      is enabled. This field is ignored on OpenShift.
                    properties:
                      kind:
                        description: |-
                          Kind of the cert-manager issuer.
                          When empty, the operator environment is used, falling back to ClusterIssuer.
                        enum:
                        - Issuer
                        - ClusterIssuer
                        type: string
                      name:
                        description: Name of the cert-manager issuer. When empty,
                          the platform default issuer name is used.
                        maxLength: 253
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    type: object
                  secretName:
                    description: |-
                      SecretName specifies the name of the Kubernetes Secret resource that contains a
                      TLS certificate secure HTTP communications for the KNative network.
                    type: string
                  type:
                    description: |-
                      Type specifies if the TLS certificate should be generated automatically, or if the certificate
                      is provided by the user. Allowed values are:
                      * SelfSigned: A certificate is generated automatically; on XKS, cert-manager issues it.
                      * Provided: Pre-existence of the TLS Secret (see SecretName) with a valid certificate is assumed.
                      * OpenshiftDefaultIngress: Uses the cluster's default ingress certificate (OpenShift only).
                      When unset, the operator selects a platform-appropriate default: OpenshiftDefaultIngress on
                      OpenShift and SelfSigned on XKS (vanilla Kubernetes), where cert-manager issues the
                      certificate. A static CRD default is intentionally omitted so this platform-aware selection
                      can apply; see handleCertificates.
                    enum:
                    - SelfSigned
                    - Provided
                    - OpenshiftDefaultIngress
                    type: string
                type: object
              cookie:
                description: Cookie configuration (applies to both OIDC and OpenShift
                  OAuth)
                properties:
                  expire:
                    default: 24h
                    description: |-
                      Expire duration for OAuth2 proxy session cookie (e.g., "24h", "8h")
                      This controls how long the session cookie is valid before requiring re-authentication.
                    type: string
                  refresh:
                    default: 1h
                    description: |-
                      Refresh duration for OAuth2 proxy to refresh access tokens (e.g., "2h", "1h", "30m")
                      This must be LESS than the OIDC provider's Access Token Lifespan to avoid token expiration.
                      For example, if Keycloak Access Token Lifespan is 1 hour, set this to "30m" or "45m".
                    type: string
                type: object
              domain:
                description: |-
                  Domain specifies the host name for intercepting incoming requests.
                  Most likely, you will want to use a wildcard name, like *.example.com.
                  If not set, the cluster's default ingress domain is used (when available).
                  On Kubernetes clusters without a discoverable ingress domain, this field is required.
                  If you choose to generate a certificate, this is the domain used for the certificate request.
                  Example: *.example.com, example.com, apps.example.com
                pattern: ^(\*\.)?([a-z0-9]([-a-z0-9]*[a-z0-9])?\.)*[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              enableK8sTokenValidation:
                default: true
                description: |-
                  EnableK8sTokenValidation enables Kubernetes service account token validation via TokenReview API.
                  When enabled, kube-auth-proxy validates bearer tokens as service account tokens alongside OAuth/OIDC authentication.
                  This allows service accounts to authenticate via bearer tokens while human users authenticate via OAuth/OIDC.
                type: boolean
              ingressMode:
                description: |-
                  IngressMode specifies how the Gateway is exposed externally.
                  "OcpRoute" uses ClusterIP with OpenShift Routes (OpenShift only).
                  "LoadBalancer" uses a LoadBalancer service type (requires cloud or MetalLB).
                enum:
                - OcpRoute
                - LoadBalancer
                type: string
              networkPolicy:
                description: |-
                  NetworkPolicy configures NetworkPolicy behavior for kube-auth-proxy.
                  It is retained for backward compatibility and has no effect; the operator
                  always manages the kube-auth-proxy NetworkPolicy.
                  Deprecated: This setting is ignored and will be removed in a future API version.
                properties:
                  ingress:
                    description: |-
                      Ingress is retained for backward compatibility and has no effect.
                      Deprecated: This setting is ignored.
                    properties:
                      enabled:
                        description: |-
                          Enabled is retained for backward compatibility and has no effect.
                          Deprecated: This setting is ignored.
                        type: boolean
                    required:
                    - enabled
                    type: object
                type: object
              ocpRoute:
                description: |-
                  OCPRoute configures the OpenShift Route exposing the default shared Gateway.
                  These settings are only valid in OcpRoute mode and do not configure an external load balancer.
                  Remove this field when switching to LoadBalancer mode.
                properties:
                  serverTimeout:
                    description: |-
                      ServerTimeout is the maximum server-side inactivity interval enforced by the OpenShift router.
                      It applies to all traffic using the default shared Gateway Route, independently of HTTPRoute timeouts
                      and AuthProxyTimeout. It does not apply to additional ingress Routes or upgraded connections.
                      Specify a positive integer without leading zeros and with a unit of ms, s, m, or h (for example, "330s").
                      The maximum is 2147483647ms, matching HAProxy's supported timeout range.
                      When omitted, the operator sets a 60s Route timeout if the default IngressController's
                      server timeout is below 60s (OpenShift uses 30s when that field is unset).
                      Otherwise, or if the default IngressController is missing or its API is unsupported,
                      no timeout annotation is set. Other lookup errors, including permission and connection
                      failures, fail reconciliation.
                      Automatic behavior reads openshift-ingress-operator/default.
                      Removing this field restores automatic behavior; automatic values are not written to GatewayConfig.
                    maxLength: 16
                    pattern: ^[1-9][0-9]*(ms|s|m|h)$
                    type: string
                    x-kubernetes-validations:
                    - message: serverTimeout must be positive and no greater than
                        2147483647ms
                      rule: duration(self) > duration('0s') && duration(self) <= duration('2147483647ms')
                type: object
              oidc:
                description: OIDC configuration (used when cluster is in OIDC authentication
                  mode)
                properties:
                  clientID:
                    description: OIDC client ID
                    type: string
                  clientSecretRef:
                    description: Reference to secret containing client secret
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  issuerURL:
                    description: |-
                      OIDC issuer URL. Must be an https URL with a non-empty host and no query or
                      fragment component (an OIDC issuer identifier has neither).
                    format: uri
                    maxLength: 2048
                    minLength: 1
                    pattern: ^https://[^?#\s]+$
                    type: string
                    x-kubernetes-validations:
                    - message: issuerURL must have a non-empty host
                      rule: url(self).getHostname() != ''
                  secretNamespace:
                    description: |-
                      Namespace where the client secret is located.
                      If unset, defaults to the gateway namespace.
                    type: string
                required:
                - clientID
                - clientSecretRef
                - issuerURL
                type: object
              providerCASecretName:
                description: |-
                  ProviderCASecretName is the name of the secret containing the CA certificate for the authentication provider.
                  Used when the OAuth/OIDC provider uses a self-signed or custom CA certificate.
                  Secret must exist in the gateway namespace and contain a 'ca.crt' key with the PEM-encoded CA certificate.
                type: string
              subdomain:
                description: |-
                  Subdomain configuration for the GatewayConfig
                  Example: my-gateway, custom-gateway
                maxLength: 63
                pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?)$
                type: string
              tokenReview:
                description: |-
                  TokenReview configures the rate limiting and caching behavior of Kubernetes TokenReview API calls
                  used for service account token validation.
                  If not set, kube-auth-proxy uses built-in defaults (QPS=50, Burst=100, CacheTTL=10s).
                  These settings only take effect when EnableK8sTokenValidation is true.
                properties:
                  burst:
                    description: |-
                      Burst is the maximum burst of requests to the Kubernetes API for TokenReview calls.
                      Should be equal to or greater than QPS.
                      If not set, kube-auth-proxy uses its built-in default (100).
                    format: int32
                    minimum: 1
                    type: integer
                  cacheTTL:
                    description: |-
                      CacheTTL is how long validated token results are cached before re-validation (e.g., "10s", "30s").
                      If not set, kube-auth-proxy uses its built-in default (10s).
                    type: string
                  qps:
                    description: |-
                      QPS is the maximum queries per second to the Kubernetes API for TokenReview calls.
                      Higher values allow more concurrent token validation requests.
                      If not set, kube-auth-proxy uses its built-in default (50).
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              verifyProviderCertificate:
                default: true
                description: |-
                  VerifyProviderCertificate controls TLS certificate verification for the authentication provider.
                  When true (default), certificates are verified against the system trust store and providerCASecretName.
                  When false, certificate verification is disabled (development/testing only).
                  WARNING: Setting this to false disables security and should only be used in non-production environments.
                  For production use with self-signed certificates, use ProviderCASecretName instead.
                type: boolean
            type: object
            x-kubernetes-validations:
            - message: ocpRoute is only valid in OcpRoute ingress mode
              rule: '!has(self.ingressMode) || self.ingressMode != ''LoadBalancer''
                || !has(self.ocpRoute)'
          status:
            description: GatewayConfigStatus defines the observed state of GatewayConfig
            properties:
              additionalIngresses:
                description: |-
                  AdditionalIngresses contains configured additional ingresses, including entries that are not ready.
                  Their GatewayReady conditions feed the top-level AdditionalGatewaysReady condition.
                items:
                  description: AdditionalIngressStatus reports readiness for one additional
                    ingress.
                  properties:
                    conditions:
                      description: Conditions report Gateway, Route, authentication,
                        and aggregate readiness.
                      items:
                        properties:
                          lastHeartbeatTime:
                            description: |-
                              The last time we got an update on a given condition, this should not be set and is
                              present only for backward compatibility reasons
                            format: date-time
                            type: string
                          lastTransitionTime:
                            description: |-
                              lastTransitionTime is the last time the condition transitioned from one status to another.
                              This should be when the underlying condition changed.
                              If that is not known, then using the time when the API field changed is acceptable.
                            format: date-time
                            type: string
                          message:
                            description: message is a human-readable message indicating
                              details about the transition.
                            type: string
                          observedGeneration:
                            description: |-
                              observedGeneration represents the .metadata.generation that the condition was set based upon.
                              For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration
                              is 9, the condition is out of date with respect to the current state of the instance.
                            format: int64
                            minimum: 0
                            type: integer
                          reason:
                            description: |-
                              reason contains a programmatic identifier indicating the reason for the condition's last transition.
                              The value should be a CamelCase string.
                            type: string
                          severity:
                            description: |-
                              Severity with which to treat failures of this type of condition.
                              When this is not specified, it defaults to Error.
                            type: string
                          status:
                            description: status of the condition, one of True, False,
                              Unknown.
                            enum:
                            - "True"
                            - "False"
                            - Unknown
                            type: string
                          type:
                            description: type of condition in CamelCase or in foo.example.com/CamelCase.
                            maxLength: 316
                            pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                            type: string
                        required:
                        - status
                        - type
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - type
                      x-kubernetes-list-type: map
                    gatewayRef:
                      description: |-
                        GatewayRef identifies the operator-managed Gateway for component HTTPRoute parentRefs.
                        The reference remains published while the ingress is configured, regardless of readiness.
                      properties:
                        name:
                          description: Name is the Gateway name.
                          type: string
                        namespace:
                          description: Namespace is the namespace containing the Gateway.
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                    hostname:
                      description: Hostname is the configured externally visible hostname.
                      type: string
                    name:
                      description: Name is the stable identity of the configured ingress.
                      type: string
                  required:
                  - hostname
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              conditions:
                items:
                  properties:
                    lastHeartbeatTime:
                      description: |-
                        The last time we got an update on a given condition, this should not be set and is
                        present only for backward compatibility reasons
                      format: date-time
                      type: string
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.
                        If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human-readable message indicating
                        details about the transition.
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration
                        is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        The value should be a CamelCase string.
                      type: string
                    severity:
                      description: |-
                        Severity with which to treat failures of this type of condition.
                        When this is not specified, it defaults to Error.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              domain:
                description: |-
                  Domain is the computed gateway domain (subdomain + cluster domain or default)
                  This is the single source of truth for the gateway domain used by all components
                type: string
              observedGeneration:
                description: The generation observed by the resource controller.
                format: int64
                type: integer
              phase:
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: GatewayConfig name must be default-gateway
          rule: self.metadata.name == 'default-gateway'
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
