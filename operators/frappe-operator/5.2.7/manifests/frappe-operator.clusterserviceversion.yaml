      deployments:
      - label:
          app.kubernetes.io/component: manager
          app.kubernetes.io/created-by: frappe-operator
          app.kubernetes.io/instance: controller-manager
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: deployment
          app.kubernetes.io/part-of: frappe-operator
          control-plane: controller-manager
        name: frappe-operator-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              control-plane: controller-manager
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                control-plane: controller-manager
            spec:
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/arch
                        operator: In
                        values:
                        - amd64
                        - arm64
                        - ppc64le
                        - s390x
                      - key: kubernetes.io/os
                        operator: In
                        values:
                        - linux
              containers:
              - args:
                - --secure-listen-address=0.0.0.0:8443
                - --upstream=http://127.0.0.1:8080/
                - --logtostderr=true
                - --v=0
                image: kubebuilder/kube-rbac-proxy:v0.13.1
                name: kube-rbac-proxy
                ports:
                - containerPort: 8443
                  name: https
                  protocol: TCP
                resources:
                  limits:
                    cpu: 500m
                    memory: 128Mi
                  requests:
                    cpu: 5m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
              - args:
                - --health-probe-bind-address=:8081
                - --metrics-bind-address=127.0.0.1:8080
                - --leader-elect
                command:
                - /manager
                env:
                - name: FRAPPE_ENFORCE_HTTPS
                  valueFrom:
                    configMapKeyRef:
                      key: enforceHTTPS
                      name: frappe-operator-frappe-operator-config
                      optional: true
                - name: FRAPPE_DEFAULT_CLUSTER_ISSUER
                  valueFrom:
                    configMapKeyRef:
                      key: defaultClusterIssuer
                      name: frappe-operator-frappe-operator-config
                      optional: true
                - name: RELATED_IMAGE_FRAPPE_BENCH_V15
                  value: frappe/erpnext:version-15
                - name: RELATED_IMAGE_FRAPPE_BENCH_V14
                  value: frappe/erpnext:version-14
                - name: RELATED_IMAGE_MARIADB
                  value: mariadb:10.6
                - name: RELATED_IMAGE_REDIS
                  value: redis:7.0-alpine
                - name: RELATED_IMAGE_UTILITY_UBI
                  value: registry.access.redhat.com/ubi9/ubi-minimal:latest
                image: ghcr.io/vyogotech/frappe-operator:v5.2.7
                imagePullPolicy: IfNotPresent
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 128Mi
                  requests:
                    cpu: 10m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
              securityContext:
                runAsNonRoot: true
              serviceAccountName: frappe-operator-controller-manager
              terminationGracePeriodSeconds: 10
