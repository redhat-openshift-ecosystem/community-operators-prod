        serviceAccountName: opendatahub-operator-controller-manager
      deployments:
      - label:
          control-plane: controller-manager
          name: opendatahub-operator
        name: opendatahub-operator-controller-manager
        spec:
          replicas: 3
          selector:
            matchLabels:
              control-plane: controller-manager
              name: opendatahub-operator
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
                openshift.io/required-scc: restricted-v2
              labels:
                control-plane: controller-manager
                name: opendatahub-operator
            spec:
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/os
                        operator: In
                        values:
                        - linux
                podAntiAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                  - podAffinityTerm:
                      labelSelector:
                        matchExpressions:
                        - key: name
                          operator: In
                          values:
                          - opendatahub-operator
                      topologyKey: kubernetes.io/hostname
                    weight: 100
              containers:
              - args:
                - --health-probe-bind-address=:8081
                - --metrics-bind-address=:8443
                - --metrics-secure=true
                - --metrics-cert-path=/etc/metrics-certs
                - --leader-elect
                command:
                - /manager
                env:
                - name: DISABLE_DSC_CONFIG
                  value: "true"
                - name: OPERATOR_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: DEFAULT_MANIFESTS_PATH
                  value: /opt/manifests
                - name: DEFAULT_CHARTS_PATH
                  value: /opt/charts
                - name: ODH_PLATFORM_TYPE
