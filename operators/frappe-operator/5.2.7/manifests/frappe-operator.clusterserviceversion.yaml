  description: |
    The Frappe Operator brings the robust capabilities of Frappe and ERPNext frameworks natively into Kubernetes using the Operator Pattern.

    ### Features
    * **FrappeBench Provisioning**: Automatically deploy and scale custom Frappe stacks natively.
    * **Database Harmonization**: Spin up shared or dedicated MariaDB instances tailored.
    * **Automated Replicas**: High Availability web worker routing via Ingress.
    * **GitOps Compliance**: Designed to operate smoothly with ArgoCD.

    ### Prerequisites

    **Install a database provider before creating sites.** MariaDB is the
    default: a `FrappeSite` that does not set `spec.dbConfig.provider` uses it,
    so install the MariaDB Operator unless every site specifies a different
    provider.

    These are deliberately not declared as OLM dependencies. The operator
    supports four database providers, and a hard dependency would both force
    MariaDB on PostgreSQL-only users and make the bundle impossible to install
    on any cluster whose catalogs do not carry the required package.

    Install whichever matches your configuration:

    * Dedicated PostgreSQL with `postgresEngine: stackgres` needs StackGres (`stackgres-community`).
    * Dedicated PostgreSQL with `postgresEngine: percona` needs the Percona Operator for PostgreSQL (`percona-postgresql-operator`).
    * Shared PostgreSQL needs any reachable PostgreSQL, for example CloudNativePG.
    * Worker autoscaling needs KEDA (`keda`).
    * Admission webhooks, when enabled, need cert-manager.

    Shared PostgreSQL mode is engine-agnostic: it only needs a reachable
    `host:port` and a provisioner Secret, so any PostgreSQL will do.

    ### Setup
    Ensure that you have deployed the prerequisites above before bootstrapping an ERPNext portal using standard `kubectl apply` commands.
