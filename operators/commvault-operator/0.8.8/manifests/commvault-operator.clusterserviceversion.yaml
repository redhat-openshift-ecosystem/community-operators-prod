---
apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: commvault-operator.v0.8.8
  namespace: placeholder
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "commvault.com/v1",
          "kind": "CommvaultConfig",
          "metadata": {
            "name": "commvault",
            "namespace": "commvault"
          },
          "spec": {
            "commServeURL": "https://commserve.example.com/api",
            "tokenSecretRef": {
              "name": "commvault-token",
              "key": "token"
            },
            "gateway": {
              "replicas": 1
            }
          }
        }
      ]
    categories: "Monitoring"
    capabilities: Seamless Upgrades
    certified: "false"
    containerImage: quay.io/rdikkar/commvault@sha256:c3d22c571426c8b9dedd1ae80ef95f24568ab8b7ed158f536895790ffbdd24ab
    createdAt: "2026-08-11T13:11:04Z"
    support: Commvault
    repository: https://github.com/rohithnair2022/ocp-plugin
    description: OpenShift console visibility for Commvault application protection, jobs, and VM backup status
    operators.operatorframework.io/builder: operator-sdk-v1.37.0
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
    features.operators.openshift.io/disconnected: "true"
    features.operators.openshift.io/fips-compliant: "false"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/tls-profiles: "false"
    features.operators.openshift.io/token-auth-aws: "false"
    features.operators.openshift.io/token-auth-azure: "false"
    features.operators.openshift.io/token-auth-gcp: "false"
    features.operators.openshift.io/cnf: "false"
    features.operators.openshift.io/cni: "false"
    features.operators.openshift.io/csi: "false"
spec:
  displayName: Commvault for OpenShift
  description: |
    ## Commvault for OpenShift

    Commvault for OpenShift brings native visibility into your Commvault data
    protection environment directly inside the OpenShift console -- no separate
    Command Center tab required.

    ### Capabilities

    - **Application protection status** -- review the protection state of
      Kubernetes applications registered in Commvault
    - **Job history** -- browse, filter, sort, and resize Commvault job history
      directly in the OpenShift console
    - **VM protection details** -- view OpenShift Virtualization VMs alongside
      Commvault protection and backup information
    - **Dashboard summary** -- review protected and unprotected application and
      VM counts from Commvault Command Center

    ### Architecture

    Installing the operator deploys:
    - **Console Plugin** -- dynamic plugin serving the React UI inside the OpenShift console
    - **Operator Controller** -- manages the console-plugin integration and
      watches for a CommvaultConfig resource

    Creating a `CommvaultConfig` custom resource (via the built-in setup wizard) deploys:
    - **Gateway** -- lightweight backend proxy that calls the Commvault Command Center
      REST API; credentials are stored as a Kubernetes Secret, never exposed to the browser

    ### Prerequisites

    - OpenShift 4.14+
    - Commvault Command Center with REST API access
    - A Commvault access token (entered via the setup wizard -- stored as a Kubernetes Secret)
    - OpenShift Virtualization (optional, required only for VM visibility features)

    ### Getting Started

    1. In OperatorHub, select **All namespaces on the cluster** and choose the namespace where the operator will run
    2. Navigate to **Commvault** in the OpenShift console navigation
    3. Follow the setup wizard -- enter your Command Center URL and access token
    4. The operator deploys the gateway automatically; data appears in the console when the gateway is ready
  version: 0.8.8
  replaces: commvault-operator.v0.8.7
  maturity: alpha
  minKubeVersion: "1.27.0"
  keywords:
    - commvault
    - data-protection
    - observability
    - monitoring
    - virtualization
    - kubevirt
    - openshift
  maintainers:
    - name: Commvault Engineering
      email: engineering@commvault.com
  provider:
    name: Commvault
    url: https://www.commvault.com
  links:
    - name: Commvault Documentation
      url: https://documentation.commvault.com
    - name: Commvault Support
      url: https://www.commvault.com/support
    - name: Source Code
      url: https://github.com/rohithnair2022/ocp-plugin
  icon:
    - base64data: ""
      mediatype: image/png
  installModes:
    - type: AllNamespaces
      supported: true
  install:
    strategy: deployment
    spec:
      clusterPermissions:
        - serviceAccountName: commvault-operator
          rules:
            - apiGroups: ["commvault.com"]
              resources:
                - commvaultconfigs
                - commvaultconfigs/status
                - commvaultconfigs/finalizers
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: ["apps"]
              resources: ["deployments"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: [""]
              resources: ["services", "serviceaccounts", "secrets", "configmaps"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: ["operator.openshift.io"]
              resources: ["consoles"]
              verbs: ["get", "list", "patch", "update"]
            - apiGroups: ["console.openshift.io"]
              resources: ["consoleplugins"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: ["kubevirt.io"]
              resources: ["virtualmachines"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["coordination.k8s.io"]
              resources: ["leases"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["create", "patch"]
      deployments:
        - name: commvault-operator
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: commvault-operator
                app.kubernetes.io/name: commvault-operator
            template:
              metadata:
                labels:
                  app: commvault-operator
                  app.kubernetes.io/name: commvault-operator
                  app.kubernetes.io/part-of: commvault
                  app.kubernetes.io/managed-by: olm
              spec:
                serviceAccountName: commvault-operator
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                terminationGracePeriodSeconds: 10
                containers:
                  - name: manager
                    image: quay.io/rdikkar/commvault@sha256:c3d22c571426c8b9dedd1ae80ef95f24568ab8b7ed158f536895790ffbdd24ab
                    imagePullPolicy: IfNotPresent
                    env:
                      - name: GATEWAY_IMAGE
                        value: quay.io/rdikkar/commvault@sha256:fa4c324d4d0ef6a3b38213275db50ec33030c80edccdf7dc46bc87c6a870a7fb
                      - name: OPERATOR_NAMESPACE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.namespace
                    args:
                      - "--leader-elect"
                      - "--health-probe-bind-address=:8081"
                      - "--metrics-bind-address=:8080"
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - ALL
                    ports:
                      - containerPort: 8080
                        name: metrics
                        protocol: TCP
                      - containerPort: 8081
                        name: health
                        protocol: TCP
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8081
                      initialDelaySeconds: 15
                      periodSeconds: 20
                      timeoutSeconds: 5
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 8081
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      timeoutSeconds: 3
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 256Mi
        - name: commvault-console-plugin
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: commvault-console-plugin
                app.kubernetes.io/name: commvault-console-plugin
            template:
              metadata:
                labels:
                  app: commvault-console-plugin
                  app.kubernetes.io/name: commvault-console-plugin
                  app.kubernetes.io/component: console-plugin
                  app.kubernetes.io/part-of: commvault
                  app.kubernetes.io/managed-by: olm
              spec:
                serviceAccountName: commvault-operator
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                terminationGracePeriodSeconds: 10
                containers:
                  - name: console-plugin
                    image: quay.io/rdikkar/commvault@sha256:1669a603519203490e93e6bfe357300307656263af529a6c560deaaa60b02118
                    imagePullPolicy: IfNotPresent
                    env:
                      - name: COMMVAULT_NAMESPACE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.namespace
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    ports:
                      - containerPort: 9443
                        name: https
                        protocol: TCP
                    livenessProbe:
                      httpGet:
                        path: /health
                        port: 9443
                        scheme: HTTPS
                      initialDelaySeconds: 10
                      periodSeconds: 30
                      timeoutSeconds: 3
                      failureThreshold: 3
                    readinessProbe:
                      httpGet:
                        path: /health
                        port: 9443
                        scheme: HTTPS
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      timeoutSeconds: 3
                      failureThreshold: 3
                    resources:
                      requests:
                        cpu: 50m
                        memory: 64Mi
                      limits:
                        cpu: 200m
                        memory: 128Mi
                    volumeMounts:
                      - name: serving-cert
                        mountPath: /var/serving-cert
                        readOnly: true
                volumes:
                  - name: serving-cert
                    secret:
                      secretName: commvault-console-plugin-cert
  customresourcedefinitions:
    owned:
      - name: commvaultconfigs.commvault.com
        version: v1
        kind: CommvaultConfig
        displayName: Commvault Configuration
        description: >-
          Configures the Commvault data protection integration. When created,
          the operator deploys the gateway component that connects to your
          Commvault Command Center. Use the built-in setup wizard in the
          console instead of creating this resource manually.
        specDescriptors:
          - path: commServeURL
            displayName: CommServe URL
            description: Base URL of the Commvault Command Center API
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
          - path: tokenSecretRef
            displayName: Token Secret Reference
            description: Secret containing the CommServe access token
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes:Secret
          - path: gateway.replicas
            displayName: Gateway Replicas
            description: Number of gateway pod replicas
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:podCount
        statusDescriptors:
          - path: phase
            displayName: Phase
            description: Current lifecycle phase
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes.phase
          - path: conditions
            displayName: Conditions
            description: Detailed component status conditions
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes.conditions
  relatedImages:
    - name: operator
      image: quay.io/rdikkar/commvault@sha256:c3d22c571426c8b9dedd1ae80ef95f24568ab8b7ed158f536895790ffbdd24ab
    - name: gateway
      image: quay.io/rdikkar/commvault@sha256:fa4c324d4d0ef6a3b38213275db50ec33030c80edccdf7dc46bc87c6a870a7fb
    - name: console-plugin
      image: quay.io/rdikkar/commvault@sha256:1669a603519203490e93e6bfe357300307656263af529a6c560deaaa60b02118
