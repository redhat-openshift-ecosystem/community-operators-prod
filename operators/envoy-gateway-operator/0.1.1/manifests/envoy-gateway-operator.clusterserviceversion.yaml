        kind: EnvoyGateway
        name: envoygateways.envoygateway.ccangemi.github.io
        version: v1alpha1
      - kind: EnvoyPatchPolicy
        name: envoypatchpolicies.gateway.envoyproxy.io
        version: v1alpha1
        displayName: EnvoyPatchPolicy
        description: EnvoyPatchPolicy allows the user to modify the generated Envoy xDS resources by Envoy Gateway using this patch API
      - kind: EnvoyProxy
        name: envoyproxies.gateway.envoyproxy.io
        version: v1alpha1
        displayName: EnvoyProxy
        description: EnvoyProxy is the schema for the envoyproxies API.
      - kind: HTTPRouteFilter
        name: httproutefilters.gateway.envoyproxy.io
        version: v1alpha1
        displayName: HTTPRouteFilter
        description: HTTPRouteFilter is a custom Envoy Gateway HTTPRouteFilter which provides extended traffic processing options such as path regex rewrite, direct response and more.
      - kind: SecurityPolicy
        name: securitypolicies.gateway.envoyproxy.io
        version: v1alpha1
        displayName: SecurityPolicy
        description: SecurityPolicy allows the user to configure various security settings for a Gateway.
  description: |
    This community operator installs [Envoy Gateway](https://gateway.envoyproxy.io/)
    v1.9.3 on OpenShift. Envoy Gateway implements the Kubernetes
    Gateway API with Envoy Proxy.

    The operator is a Helm operator: it installs the upstream `gateway-helm`
    chart, unchanged. The spec of the `EnvoyGateway` resource holds the values
    of the chart, so the upstream documentation of the chart applies.

    The operator uses the Gateway API that OpenShift provides. It never
    installs, changes or removes the Gateway API CRDs
    (`gateway.networking.k8s.io`), which belong to the OpenShift Ingress
    Operator.

    ## Before you install

    * OpenShift 4.22, the only supported version. The operator needs
      Gateway API v1.4 (`BackendTLSPolicy` v1), which OpenShift 4.22 provides.
    * Create the namespace `envoy-gateway-system`, and install the operator
      there with the "A specific namespace on the cluster" install mode.

    ## Install Envoy Gateway

    Create one `EnvoyGateway` resource, named `envoy-gateway`, in the namespace
    of the operator:

    ```yaml
    apiVersion: envoygateway.ccangemi.github.io/v1alpha1
    kind: EnvoyGateway
    metadata:
      name: envoy-gateway
      namespace: envoy-gateway-system
    spec: {}
    ```

    The operator then installs:

    * the Envoy Gateway controller, in the same namespace;
    * the certificates of the control plane, with the upstream `certgen` job.

    The Envoy Gateway CRDs (`gateway.envoyproxy.io`) come with the operator.
    OLM installs and upgrades them.

    The operator does not create a GatewayClass, a Gateway or any route. You
    create them, for example with a Helm chart or with Argo CD.

    ## Values that the operator sets

    Some values of the chart are fixed, so that the installation works on
    OpenShift: no Gateway API CRDs, no fixed user IDs (the controller runs
    with the `restricted-v2` SCC), no `watch` block, no namespace creation,
    and the images pinned by digest. The topology injector is off by default.
    The operator documentation lists all of them.

    ## OpenShift notes

    Envoy Gateway always runs the Envoy proxy pods with the fixed user ID
    65532, which `restricted-v2` does not allow. Give the service account of
    each Gateway the `nonroot-v2` SCC, with a RoleBinding to the cluster role
    `system:openshift:scc:nonroot-v2`. The operator documentation has an
    example.

    ## The Agent Router

    To use [The Agent Router](https://github.com/theagentrouter/agent-router)
    (formerly Envoy AI Gateway), set the extension manager values of Envoy
    Gateway in the `EnvoyGateway` resource, then install the Agent Router
    operator. The operator documentation has a complete example.

    ## Documentation

    See the [operator repository](https://github.com/ccangemi/envoy-operator)
    for the installation guide, the upgrade notes and the troubleshooting
    guide.

    This is a community project. It is not affiliated with, or endorsed by,
    the Envoy project.
