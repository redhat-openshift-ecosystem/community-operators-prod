---
defaultChannel: stable-v0.7
description: |
  The Flyway Operator runs [Flyway](https://flywaydb.org/) database migrations from a declarative
  `Migration` resource. The operator creates a Kubernetes Job that runs Flyway against your database
  and reports the result in the `Migration` status, so schema changes are applied, retried and observed
  the same way as the rest of your cluster configuration, for example from GitOps.

  ### Features

  - **Migrations shipped as an image.** The SQL files come from a container image that is mounted read-only
    into the Flyway container as an image volume. The image needs no shell and can be `FROM scratch`.
  - **Status you can act on.** `Applied`, `Progressing` and `Failed` conditions, the attempt count and the
    last applied image and generation.
  - **Retries and deadlines.** Failed Jobs are retried up to `retryLimit` and stop at `activeDeadline`.
  - **Pause.** Set an annotation to hold reconciliation while you investigate.
  - **Observability.** Prometheus metrics, a `ServiceMonitor`, alert rules and Grafana dashboards.
  - **Restricted by default.** Jobs run under the `restricted` Pod Security Standard.

  ### Prerequisites

  - Kubernetes 1.35 or later (OpenShift 4.22 or later). Migration Jobs use image volumes, and the
    `ImageVolume` feature gate is on by default from Kubernetes 1.35.
  - A container runtime with image volume support (CRI-O 1.31 or later, containerd 2.1 or later).
  - A database reachable from the cluster and a Secret holding its password.

  ### Getting started

  Create a `Migration` that names the database, the Flyway configuration and the migration image, as in the
  [usage guide](https://github.com/davidkarlsen/flyway-operator/blob/main/docs/usage.md). See also
  [installing](https://github.com/davidkarlsen/flyway-operator/blob/main/docs/installing.md),
  [metrics](https://github.com/davidkarlsen/flyway-operator/blob/main/docs/metrics.md),
  [dashboards](https://github.com/davidkarlsen/flyway-operator/blob/main/docs/dashboards.md) and the
  [runbook](https://github.com/davidkarlsen/flyway-operator/blob/main/docs/runbook.md) for the alerts.
