    apiServiceDefinitions: {}
    crdDescriptions:
      owned:
      - description: |-
          KrknFileType is the Schema for the krknfiletypes API.
          It defines metadata for file categories used in the ConfigMap-based file management system.

          File types are automatically created when first used in a file, allowing for
          GitHub-style label management where types can be created on-the-fly or reused.

          Each file can have only one type, enforced at the API level.
          Types cannot be deleted if files are still using them (enforced by the API handler).
        kind: KrknFileType
        name: krknfiletypes.krkn.krkn-chaos.dev
        version: v1alpha1
      - description: KrknGraphRun is the Schema for the krkngraphruns API
        kind: KrknGraphRun
        name: krkngraphruns.krkn.krkn-chaos.dev
        version: v1alpha1
      - description: KrknOperatorTargetProviderConfig is the Schema for the krknoperatortargetproviderconfigs
          API.
        kind: KrknOperatorTargetProviderConfig
        name: krknoperatortargetproviderconfigs.krkn.krkn-chaos.dev
        version: v1alpha1
      - description: KrknOperatorTargetProvider is the Schema for the krknoperatortargetproviders
          API.
        kind: KrknOperatorTargetProvider
        name: krknoperatortargetproviders.krkn.krkn-chaos.dev
        version: v1alpha1
      - description: KrknOperatorTarget is the Schema for the krknoperatortargets
          API.
        kind: KrknOperatorTarget
        name: krknoperatortargets.krkn.krkn-chaos.dev
        version: v1alpha1
      - description: KrknScenarioRun is the Schema for the krknscenrarioruns API
        kind: KrknScenarioRun
        name: krknscenarioruns.krkn.krkn-chaos.dev
        version: v1alpha1
      - description: KrknTargetRequest is the Schema for the krkntargetrequests API.
        kind: KrknTargetRequest
        name: krkntargetrequests.krkn.krkn-chaos.dev
        version: v1alpha1
      - description: |-
          KrknUserGroup is the Schema for the krknusergroups API.
          It defines cluster-level access control for groups of users.

          Users are associated with groups via labels on their KrknUser CR:
            - group.krkn.krkn-chaos.dev/<group-name>: "true"

          Permissions are aggregated across all groups a user belongs to (union).
          Admin users bypass all group-based access controls.
        kind: KrknUserGroup
        name: krknusergroups.krkn.krkn-chaos.dev
        version: v1alpha1
      - description: |-
          KrknUser is the Schema for the krknusers API.
          It represents an authentication entity for the krkn-operator REST APIs.

          The KrknUser CRD must be labeled with:
            - krkn.krkn-chaos.dev/user-account: "true"
            - krkn.krkn-chaos.dev/role: <user|admin>
        kind: KrknUser
        name: krknusers.krkn.krkn-chaos.dev
        version: v1alpha1
    description: |
      Krkn provides centralized chaos engineering and resiliency testing for
      Kubernetes, OpenShift, Open Cluster Management, and Advanced Cluster Management.

      The optional ACM integration has been tested with ACM 2.14, 2.15, and 2.16,
      and with OCM 1.1.0, 1.2.0, and 1.3.1. Kubernetes and OpenShift compatibility
      details are maintained in the compatibility documentation.

      IMPORTANT: The installation creates the console Service, but does not create
      an Ingress or an OpenShift Route. To access the console, expose the
      krkn-operator-console Service manually according to your cluster's ingress,
      gateway, TLS, and network configuration.
