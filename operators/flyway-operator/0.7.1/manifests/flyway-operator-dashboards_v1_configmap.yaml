apiVersion: v1
data:
  flyway-migrations.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Status and run history of Flyway Migrations, filtered by namespace. For teams owning Migrations.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "title": "flyway-operator metrics",
          "type": "link",
          "icon": "doc",
          "targetBlank": true,
          "url": "https://github.com/davidkarlsen/flyway-operator/blob/main/docs/metrics.md"
        }
      ],
      "panels": [
        {
          "type": "stat",
          "title": "Migrations",
          "description": "Selected Migrations.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "count(max by (namespace, migration) (flyway_operator_migration_paused{namespace=~\"$namespace\", migration=~\"$migration\"})) or vector(0)",
              "legendFormat": "__auto",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "id": 1,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          }
        },
        {
          "type": "stat",
          "title": "Failed",
          "description": "Failed=True: retries exhausted, the last attempt timed out, or image volumes are unsupported. Matches FlywayMigrationFailed (for: 1m). The panel shows the expression now; the alert also waits for its for: duration.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "count(\nmax by (namespace, migration) (\n  flyway_operator_migration_status_condition{namespace=~\"$namespace\", migration=~\"$migration\", condition=\"Failed\", status=\"true\"}\n) == 1\n) or vector(0)",
              "legendFormat": "__auto",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "id": 2,
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 4
          }
        },
        {
          "type": "stat",
          "title": "Stuck over 1h",
          "description": "Progressing for more than 1h and not paused. Matches FlywayMigrationStuck (for: 5m). The panel shows the expression now; the alert also waits for its for: duration.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "count(\nmax by (namespace, migration) (\n  flyway_operator_migration_status_condition{namespace=~\"$namespace\", migration=~\"$migration\", condition=\"Progressing\", status=\"true\"}\n) == 1\nand on (namespace, migration)\ntime() - max by (namespace, migration) (\n  flyway_operator_migration_status_condition_last_transition_timestamp_seconds{namespace=~\"$namespace\", migration=~\"$migration\", condition=\"Progressing\"}\n) > 3600\nunless on (namespace, migration) max by (namespace, migration) (flyway_operator_migration_paused{namespace=~\"$namespace\", migration=~\"$migration\"}) == 1\n) or vector(0)",
              "legendFormat": "__auto",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "id": 3,
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 4
          }
        },
        {
          "type": "stat",
          "title": "Retrying (30m)",
          "description": "Migrations with a failed attempt in the last 30m that is retried. A dashboard threshold; no shipped alert.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "count(\nsum by (namespace, migration) (\n  increase(flyway_operator_migration_runs_total{namespace=~\"$namespace\", migration=~\"$migration\", result=\"retrying\"}[30m])\n) > 0\n) or vector(0)",
              "legendFormat": "__auto",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "id": 4,
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 4
          }
        },
        {
          "type": "stat",
          "title": "Slow over 15m",
          "description": "The last successful run took more than 15m. A dashboard threshold; no shipped alert. Missing after an operator restart until the next run finishes.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "count(\nmax by (namespace, migration) (\n  flyway_operator_migration_last_run_duration_seconds{namespace=~\"$namespace\", migration=~\"$migration\", result=\"succeeded\"}\n) > 900\n) or vector(0)",
              "legendFormat": "__auto",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "id": 5,
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 4
          }
        },
        {
          "type": "stat",
          "title": "Paused",
          "description": "Migrations with the paused annotation set to true. A paused Migration is not reconciled.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "count(\nmax by (namespace, migration) (flyway_operator_migration_paused{namespace=~\"$namespace\", migration=~\"$migration\"}) == 1\n) or vector(0)",
              "legendFormat": "__auto",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "id": 6,
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 4
          }
        },
        {
          "type": "table",
          "title": "Migration status",
          "description": "Current conditions of each Migration from flyway_operator_migration_status_condition (True, False, or Unknown when not yet set), whether it is paused, the time since its most recent condition change, and the duration of its last successful run.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "max by (namespace, migration) (flyway_operator_migration_status_condition{namespace=~\"$namespace\", migration=~\"$migration\", condition=\"Applied\", status=\"true\"}) * 2\n+ max by (namespace, migration) (flyway_operator_migration_status_condition{namespace=~\"$namespace\", migration=~\"$migration\", condition=\"Applied\", status=\"false\"})",
              "legendFormat": "__auto",
              "format": "table",
              "instant": true,
              "range": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "B",
              "expr": "max by (namespace, migration) (flyway_operator_migration_status_condition{namespace=~\"$namespace\", migration=~\"$migration\", condition=\"Progressing\", status=\"true\"}) * 2\n+ max by (namespace, migration) (flyway_operator_migration_status_condition{namespace=~\"$namespace\", migration=~\"$migration\", condition=\"Progressing\", status=\"false\"})",
              "legendFormat": "__auto",
              "format": "table",
              "instant": true,
              "range": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "C",
              "expr": "max by (namespace, migration) (flyway_operator_migration_status_condition{namespace=~\"$namespace\", migration=~\"$migration\", condition=\"Failed\", status=\"true\"}) * 2\n+ max by (namespace, migration) (flyway_operator_migration_status_condition{namespace=~\"$namespace\", migration=~\"$migration\", condition=\"Failed\", status=\"false\"})",
              "legendFormat": "__auto",
              "format": "table",
              "instant": true,
              "range": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "D",
              "expr": "max by (namespace, migration) (flyway_operator_migration_paused{namespace=~\"$namespace\", migration=~\"$migration\"})",
              "legendFormat": "__auto",
              "format": "table",
              "instant": true,
              "range": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "E",
              "expr": "time() - max by (namespace, migration) (flyway_operator_migration_status_condition_last_transition_timestamp_seconds{namespace=~\"$namespace\", migration=~\"$migration\"})",
              "legendFormat": "__auto",
              "format": "table",
              "instant": true,
              "range": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "F",
              "expr": "max by (namespace, migration) (flyway_operator_migration_last_run_duration_seconds{namespace=~\"$namespace\", migration=~\"$migration\", result=\"succeeded\"})",
              "legendFormat": "__auto",
              "format": "table",
              "instant": true,
              "range": false
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "namespace": 0,
                  "migration": 1,
                  "Value #A": 2,
                  "Value #B": 3,
                  "Value #C": 4,
                  "Value #D": 5,
                  "Value #E": 6,
                  "Value #F": 7
                },
                "renameByName": {
                  "Value #A": "Applied",
                  "Value #B": "Progressing",
                  "Value #C": "Failed",
                  "Value #D": "Paused",
                  "Value #E": "Since last transition",
                  "Value #F": "Last successful run"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": true
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Applied"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "2": {
                            "text": "True",
                            "color": "green",
                            "index": 0
                          },
                          "1": {
                            "text": "False",
                            "color": "text",
                            "index": 1
                          },
                          "0": {
                            "text": "Unknown",
                            "color": "text",
                            "index": 2
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Progressing"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "2": {
                            "text": "True",
                            "color": "blue",
                            "index": 0
                          },
                          "1": {
                            "text": "False",
                            "color": "text",
                            "index": 1
                          },
                          "0": {
                            "text": "Unknown",
                            "color": "text",
                            "index": 2
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Failed"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "2": {
                            "text": "True",
                            "color": "red",
                            "index": 0
                          },
                          "1": {
                            "text": "False",
                            "color": "green",
                            "index": 1
                          },
                          "0": {
                            "text": "Unknown",
                            "color": "text",
                            "index": 2
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Paused"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "1": {
                            "text": "Paused",
                            "color": "orange",
                            "index": 0
                          },
                          "0": {
                            "text": "No",
                            "color": "text",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Since last transition"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last successful run"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "text",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 900
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "fields": ""
            },
            "sortBy": [
              {
                "displayName": "Failed",
                "desc": true
              }
            ]
          },
          "id": 7,
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 24,
            "h": 10
          }
        },
        {
          "type": "timeseries",
          "title": "Runs by result",
          "description": "Finished Job attempts per interval, by result: succeeded, retrying (failed, another attempt follows) or failed (retryLimit exhausted). From flyway_operator_migration_runs_total; increase() can show fractional values, and attempts finished while the operator was down are not shown.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "sum by (result) (increase(flyway_operator_migration_runs_total{namespace=~\"$namespace\", migration=~\"$migration\"}[$__rate_interval]))",
              "legendFormat": "{{result}}",
              "format": "time_series",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 80,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "off"
                },
                "axisSoftMin": 0
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "succeeded"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "retrying"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "failed"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "interval": "5m",
          "id": 8,
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "bargauge",
          "title": "Last run duration",
          "description": "Run time of the last finished attempt of each Migration, by result. Held in memory by the operator, so missing after a restart until the next run finishes. The 15m threshold on the succeeded value is a dashboard threshold; no alert ships for it.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "max by (namespace, migration, result) (flyway_operator_migration_last_run_duration_seconds{namespace=~\"$namespace\", migration=~\"$migration\"})",
              "legendFormat": "{{namespace}}/{{migration}} ({{result}})",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
