apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: group-sync-operator
  name: group-sync-operator-controller-manager-metrics-monitor
spec:
  endpoints:
  - authorization:
      credentials:
        key: token
        name: group-sync-operator-controller-manager-metrics-token
      type: Bearer
    interval: 30s
    port: https
    scheme: https
    tlsConfig:
      ca:
        secret:
          key: tls.crt
          name: group-sync-operator-certs
          optional: false
      serverName: group-sync-operator-controller-manager-metrics-service.group-sync-operator.svc
  selector:
    matchLabels:
      control-plane: group-sync-operator
